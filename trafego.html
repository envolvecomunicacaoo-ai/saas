<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="sync.js"></script>
<title>Envolve · Gestor de Tráfego (Meta Ads)</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.1/dist/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --bg:#0a0e1a; --surface:#111827; --surface-2:#1a2233; --border:#252f44;
    --text:#e8ecf3; --text-dim:#8b95a8; --text-muted:#5c6680;
    --meta:#1877F2; --insta:#E4405F;
    --success:#10b981; --warning:#f59e0b; --danger:#ef4444; --info:#06b6d4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;background-image:radial-gradient(circle at 0% 0%,rgba(24,119,242,.10),transparent 50%),radial-gradient(circle at 100% 100%,rgba(228,64,95,.06),transparent 50%);background-attachment:fixed}
  .app{max-width:1400px;margin:0 auto;padding:24px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:14px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--meta),var(--insta));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:white}
  .brand h1{font-size:18px;font-weight:600;letter-spacing:-.01em}
  .brand p{font-size:12px;color:var(--text-dim);margin-top:2px}
  .header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .badge{font-size:11px;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--border);color:var(--text-dim)}
  .badge.ok{border-color:rgba(16,185,129,.4);color:var(--success)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
  .card h2{font-size:14px;font-weight:600;margin-bottom:14px;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card h2 .sub{font-size:11px;color:var(--text-muted);font-weight:400;text-transform:uppercase;letter-spacing:.05em}

  .btn{padding:10px 18px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;font-weight:500;font-size:13px;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:#222e44;border-color:#3a4660}
  .btn-primary{background:linear-gradient(135deg,var(--meta),#0866ff);border-color:transparent;color:white}
  .btn-primary:hover{filter:brightness(1.1)}
  .btn-danger{background:transparent;color:var(--danger);border-color:rgba(239,68,68,.3)}
  .btn-ghost{background:transparent}
  .btn-sm{padding:6px 12px;font-size:12px}

  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .form-group label{font-size:11px;color:var(--text-dim);font-weight:500;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px}
  .form-group input,.form-group select{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;font-family:inherit;width:100%}
  .form-group input:focus,.form-group select:focus{outline:none;border-color:var(--meta);box-shadow:0 0 0 3px rgba(24,119,242,.15)}

  .setup-card{background:linear-gradient(135deg,rgba(24,119,242,.08),rgba(228,64,95,.05));border:1px solid rgba(24,119,242,.3);border-radius:14px;padding:24px;margin-bottom:14px}
  .setup-card h3{font-size:16px;margin-bottom:6px}
  .setup-card p{font-size:13px;color:var(--text-dim);margin-bottom:14px;line-height:1.6}
  .setup-steps{font-size:12px;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px}
  .setup-steps ol{margin-left:20px;line-height:1.8}
  .setup-steps a{color:var(--meta)}
  .setup-steps code{background:var(--bg);padding:2px 6px;border-radius:4px;font-size:11px;color:var(--meta)}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;border-top:3px solid var(--c-accent,var(--meta))}
  .kpi-label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:6px}
  .kpi-value{font-size:22px;font-weight:700;letter-spacing:-.02em}
  .kpi-trend{font-size:11px;margin-top:6px;color:var(--text-muted)}

  .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .filters select,.filters input{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;font-family:inherit}

  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:1100px}
  thead{background:var(--surface-2);position:sticky;top:0;z-index:1}
  th{padding:11px 10px;text-align:right;font-weight:600;color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
  th:hover{color:var(--text)}
  th:first-child,td:first-child{text-align:left;padding-left:14px}
  td{padding:10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
  tbody tr:hover{background:rgba(255,255,255,.02)}
  td.has-value{color:var(--text);font-weight:500}
  td.zero,td.null{color:var(--text-muted)}
  td.good{color:var(--success);font-weight:600}
  td.bad{color:var(--danger);font-weight:600}
  td.warn{color:var(--warning);font-weight:600}

  .status-pill{font-size:10px;padding:3px 8px;border-radius:99px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:white;white-space:nowrap}
  .status-active{background:var(--success)}
  .status-paused{background:var(--warning)}
  .status-deleted,.status-archived{background:var(--text-muted)}

  .obj-pill{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:600;letter-spacing:.04em;white-space:nowrap;background:var(--surface-2);color:var(--text);border:1px solid var(--border)}

  .ai-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:14px}
  .ai-card{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;transition:all .15s;text-align:left;font-family:inherit;color:var(--text)}
  .ai-card:hover{border-color:var(--meta);transform:translateY(-1px)}
  .ai-card .icon{font-size:18px;margin-bottom:4px}
  .ai-card .title{font-size:13px;font-weight:600}
  .ai-card .desc{font-size:11px;color:var(--text-dim);margin-top:2px;line-height:1.4}

  .ai-response{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:18px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-wrap:break-word;max-height:600px;overflow-y:auto}
  .ai-response strong{color:var(--text);font-weight:600}
  .ai-response code{background:var(--bg);padding:2px 6px;border-radius:4px;font-size:12px}
  .ai-response h2,.ai-response h3{color:var(--meta);margin:14px 0 8px}
  .ai-response h2{font-size:16px} .ai-response h3{font-size:14px}

  .ad-account-row{padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:all .12s}
  .ad-account-row:hover{border-color:var(--meta)}
  .ad-account-row.selected{border-color:var(--meta);background:rgba(24,119,242,.08)}
  .ad-account-row .name{font-weight:500;font-size:13px}
  .ad-account-row .meta{font-size:11px;color:var(--text-dim)}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);padding:12px 18px;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.3);font-size:13px;font-weight:500;transform:translateY(120%);transition:.25s ease;z-index:300}
  .toast.show{transform:translateY(0)}
  .toast.success{border-color:var(--success)}
  .toast.error{border-color:var(--danger)}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px)}
  .modal-bg.show{display:flex}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;max-width:600px;width:90%;max-height:90vh;overflow-y:auto}
  .modal h3{font-size:16px;margin-bottom:14px;font-weight:600}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}

  .empty-state{text-align:center;padding:40px;color:var(--text-dim)}
  .empty-state .icon{font-size:36px;margin-bottom:10px}

  .loading{display:inline-block;width:14px;height:14px;border:2px solid var(--text-dim);border-top-color:var(--meta);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media(max-width:768px){
    .app{padding:14px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">M</div>
      <div>
        <h1>Envolve · Gestor de Tráfego</h1>
        <p>Meta Ads · contas, campanhas, resultados e análise growth</p>
      </div>
    </div>
    <div class="header-actions">
      <a href="./" style="font-size:12px;padding:6px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);text-decoration:none;display:inline-flex;align-items:center;gap:6px">← Envolve</a>
      <span class="badge" id="connStatus">Não conectado</span>
      <button class="btn btn-sm" id="openSetup">⚙ Token Meta</button>
    </div>
  </header>

  <div id="content"></div>
</div>

<div class="modal-bg" id="modal"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'envolve.trafego.v2';
const FB_API = 'https://graph.facebook.com/v21.0';

// Mapas de objetivos e ações
const OBJECTIVE_LABELS = {
  OUTCOME_SALES:'Vendas', OUTCOME_LEADS:'Leads', OUTCOME_TRAFFIC:'Tráfego',
  OUTCOME_AWARENESS:'Reconhecimento', OUTCOME_ENGAGEMENT:'Engajamento',
  OUTCOME_APP_PROMOTION:'App', CONVERSIONS:'Conversões', LINK_CLICKS:'Cliques',
  MESSAGES:'Mensagens', LEAD_GENERATION:'Geração de Leads',
  PAGE_LIKES:'Curtidas', POST_ENGAGEMENT:'Engajamento',
  VIDEO_VIEWS:'Visualizações', BRAND_AWARENESS:'Reconhecimento',
  REACH:'Alcance', PRODUCT_CATALOG_SALES:'Catálogo', STORE_VISITS:'Loja física',
  EVENT_RESPONSES:'Eventos', APP_INSTALLS:'Instalações de app'
};

// Pra cada objetivo, qual ação representa o resultado e seu label
const RESULT_BY_OBJECTIVE = {
  OUTCOME_SALES:        {actions:['purchase','offsite_conversion.fb_pixel_purchase','onsite_conversion.purchase','omni_purchase'], label:'Compras'},
  CONVERSIONS:          {actions:['purchase','offsite_conversion.fb_pixel_purchase','onsite_conversion.purchase','omni_purchase'], label:'Compras'},
  PRODUCT_CATALOG_SALES:{actions:['purchase','offsite_conversion.fb_pixel_purchase'], label:'Compras'},
  OUTCOME_LEADS:        {actions:['lead','onsite_conversion.lead_grouped','offsite_conversion.fb_pixel_lead'], label:'Leads'},
  LEAD_GENERATION:      {actions:['lead','onsite_conversion.lead_grouped'], label:'Leads'},
  MESSAGES:             {actions:['onsite_conversion.messaging_conversation_started_7d','onsite_conversion.total_messaging_connection'], label:'Conversas'},
  OUTCOME_ENGAGEMENT:   {actions:['onsite_conversion.messaging_conversation_started_7d','post_engagement','page_engagement'], label:'Engajamentos'},
  POST_ENGAGEMENT:      {actions:['post_engagement'], label:'Engajamentos'},
  PAGE_LIKES:           {actions:['like'], label:'Curtidas'},
  VIDEO_VIEWS:          {actions:['video_view'], label:'Views'},
  OUTCOME_TRAFFIC:      {actions:['link_click','outbound_click'], label:'Cliques'},
  LINK_CLICKS:          {actions:['link_click'], label:'Cliques'},
  OUTCOME_AWARENESS:    {actions:[], label:'Alcance'}, // usa reach
  BRAND_AWARENESS:      {actions:[], label:'Alcance'},
  REACH:                {actions:[], label:'Alcance'},
  APP_INSTALLS:         {actions:['mobile_app_install','app_install'], label:'Instalações'}
};

const ACCOUNT_STATUS = {1:'Ativa',2:'Desativada',3:'Pendente',7:'Em revisão',8:'Pendente pagto',9:'Período de carência',100:'Em encerramento',101:'Encerrada'};

// ============ STATE ============
let state = {
  token:'', selectedAdAccount:'', adsPeriod:'last_30d',
  cachedAdAccounts:[], cachedCampaigns:[], cachedAccountInfo:null,
  campSortKey:'spend', campSortAsc:false
};

function load(){ try{ Object.assign(state, JSON.parse(localStorage.getItem(STORAGE_KEY))||{}); }catch(e){} }
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getJSON(key){ try{ return JSON.parse(localStorage.getItem(key)||'null'); }catch(e){ return null; } }

const fmtNum = v => (v||0).toLocaleString('pt-BR');
const fmtPct = v => (v||0).toFixed(2)+'%';
function fmtMoney(amount, currency){
  if(amount==null) return '—';
  return new Intl.NumberFormat('pt-BR',{style:'currency',currency:currency||'BRL'}).format(amount);
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg,type='success'){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+type; setTimeout(()=>t.classList.remove('show'),3000); }
function openModal(html){ document.getElementById('modalContent').innerHTML=html; document.getElementById('modal').classList.add('show'); }
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });

function isConnected(){ return state.token && state.token.length>20; }
function updateConnStatus(){
  const b = document.getElementById('connStatus');
  if(isConnected() && state.selectedAdAccount){
    const a = state.cachedAdAccounts.find(x=>x.id===state.selectedAdAccount);
    b.className='badge ok'; b.textContent = 'Conectado: '+(a?.name||'conta');
  } else if(isConnected()){
    b.className='badge ok'; b.textContent = 'Token OK';
  } else {
    b.className='badge'; b.textContent = 'Não conectado';
  }
}

// ============ SETUP TOKEN ============
document.getElementById('openSetup').addEventListener('click',()=>{
  openModal(`
    <h3>⚙ Configurar token Meta</h3>
    <p style="font-size:13px;color:var(--text-dim);margin-bottom:14px">Cole seu User Access Token (com permissões <code style="background:var(--surface-2);padding:1px 5px;border-radius:3px">ads_read</code> e <code style="background:var(--surface-2);padding:1px 5px;border-radius:3px">ads_management</code>). Fica salvo só no seu navegador.</p>
    <div class="form-group" style="margin-bottom:14px">
      <label>Access Token</label>
      <input type="password" id="cfg-token" value="${escapeHtml(state.token||'')}" placeholder="EAAB... (cole aqui)" autocomplete="off">
    </div>
    <p style="font-size:11px;color:var(--text-muted);line-height:1.5">
      <strong>Privacidade:</strong> token salvo APENAS no localStorage. Cada chamada vai direto da sua máquina pro Graph API.
    </p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" id="cfg-clear">Limpar tudo</button>
      <button class="btn btn-primary" id="cfg-save">Salvar</button>
    </div>
  `);
  document.getElementById('cfg-save').addEventListener('click',()=>{
    const t = document.getElementById('cfg-token').value.trim();
    if(!t || t.length<20){ toast('Token muito curto','error'); return; }
    state.token = t; state.cachedAdAccounts=[]; state.selectedAdAccount=''; state.cachedCampaigns=[]; state.cachedAccountInfo=null;
    save(); closeModal(); updateConnStatus(); render();
  });
  document.getElementById('cfg-clear').addEventListener('click',()=>{
    state = {token:'',selectedAdAccount:'',adsPeriod:'last_30d',cachedAdAccounts:[],cachedCampaigns:[],cachedAccountInfo:null,campSortKey:'spend',campSortAsc:false};
    save(); closeModal(); updateConnStatus(); render();
  });
});

// ============ MAIN RENDER ============
function render(){
  const c = document.getElementById('content');
  if(!isConnected()){
    c.innerHTML = `
      <div class="setup-card">
        <h3>Conecte sua conta Meta Ads</h3>
        <p>Pra puxar contas, campanhas, saldo e resultados, preciso de um <strong>Access Token</strong> com permissões <code>ads_read</code>. Sua chave fica salva apenas no navegador.</p>
        <div class="setup-steps">
          <strong>Como gerar (5 minutos):</strong>
          <ol>
            <li>Acesse <a href="https://developers.facebook.com/tools/explorer/" target="_blank">Graph API Explorer</a></li>
            <li>Selecione seu app (ou crie em <a href="https://developers.facebook.com/apps/" target="_blank">Meta for Developers</a>)</li>
            <li>Em "Permissions", adicione: <code>ads_read</code>, <code>ads_management</code>, <code>business_management</code></li>
            <li><strong>Generate Access Token</strong> e copie</li>
            <li>Pra não expirar em 1h, gere token de longa duração no <a href="https://developers.facebook.com/tools/debug/accesstoken/" target="_blank">Debugger</a> → Extend</li>
          </ol>
        </div>
        <button class="btn btn-primary" onclick="document.getElementById('openSetup').click()">⚙ Configurar token agora</button>
      </div>
    `;
    return;
  }
  if(!state.cachedAdAccounts.length){
    c.innerHTML = `<div class="card"><div class="empty-state"><span class="loading"></span> Carregando contas de anúncios...</div></div>`;
    loadAdAccounts();
    return;
  }
  // Tem contas — render lista + se conta selecionada, mostra detalhes
  c.innerHTML = `
    <div class="card">
      <h2>Contas de anúncios <span class="sub">${state.cachedAdAccounts.length} contas</span></h2>
      <div class="filters">
        <input type="text" id="adAccSearch" placeholder="🔍 Buscar conta..." style="flex:1;min-width:200px">
        <select id="adAccStatus">
          <option value="all">Todos status</option>
          <option value="1" selected>Ativas</option>
          <option value="2">Desativadas</option>
        </select>
        <button class="btn btn-sm" id="reloadAccs">↻ Recarregar</button>
        <span style="font-size:12px;color:var(--text-dim);margin-left:auto" id="adAccCount"></span>
      </div>
      <div id="adAccList" style="max-height:340px;overflow-y:auto;margin-top:10px"></div>
    </div>
    <div id="accDetails"></div>
  `;
  document.getElementById('adAccSearch').addEventListener('input', renderAccountList);
  document.getElementById('adAccStatus').addEventListener('change', renderAccountList);
  document.getElementById('reloadAccs').addEventListener('click',()=>{ state.cachedAdAccounts=[]; save(); render(); });
  renderAccountList();
  if(state.selectedAdAccount) showAccountDetails();
}

async function loadAdAccounts(){
  try{
    let all = []; let url = `${FB_API}/me/adaccounts?fields=id,account_id,name,currency,account_status,balance,amount_spent,spend_cap,timezone_name&limit=100&access_token=${encodeURIComponent(state.token)}`;
    while(url){
      const r = await fetch(url); const d = await r.json();
      if(d.error) throw new Error(d.error.message);
      all = all.concat(d.data||[]);
      url = d.paging?.next || null;
      if(all.length>500) break;
    }
    state.cachedAdAccounts = all; save();
    render();
  }catch(err){
    document.getElementById('content').innerHTML = `<div class="card"><div class="empty-state" style="color:var(--danger)"><strong>Erro:</strong> ${escapeHtml(err.message)}<br><small>Verifique permissão <code>ads_read</code> no token.</small></div></div>`;
  }
}

function renderAccountList(){
  const term = (document.getElementById('adAccSearch')?.value||'').toLowerCase();
  const stFilter = document.getElementById('adAccStatus')?.value||'all';
  const filtered = state.cachedAdAccounts.filter(a=>{
    if(stFilter!=='all' && String(a.account_status)!==stFilter) return false;
    if(term && !a.name.toLowerCase().includes(term) && !String(a.account_id||'').includes(term)) return false;
    return true;
  });
  document.getElementById('adAccCount').textContent = `${filtered.length} de ${state.cachedAdAccounts.length}`;
  const list = document.getElementById('adAccList');
  if(!filtered.length){
    list.innerHTML = `<div class="empty-state" style="padding:20px">Nenhuma conta com esse filtro.</div>`;
    return;
  }
  list.innerHTML = filtered.map(a=>{
    const sel = state.selectedAdAccount===a.id ? 'selected' : '';
    const stLabel = ACCOUNT_STATUS[a.account_status] || 'Status '+a.account_status;
    const balance = a.balance!=null ? fmtMoney(parseFloat(a.balance)/100, a.currency) : '—';
    return `
      <div class="ad-account-row ${sel}" data-acc="${a.id}">
        <div>
          <div class="name">${escapeHtml(a.name)}</div>
          <div class="meta">${escapeHtml(a.id)} · ${a.currency} · ${stLabel}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:10px;color:var(--text-dim);text-transform:uppercase">Saldo</div>
          <div style="font-weight:700;color:${parseFloat(a.balance)>0?'var(--success)':'var(--text-muted)'}">${balance}</div>
        </div>
      </div>
    `;
  }).join('');
  list.querySelectorAll('[data-acc]').forEach(r=> r.addEventListener('click',()=>{
    state.selectedAdAccount = r.dataset.acc;
    state.cachedCampaigns = []; state.cachedAccountInfo = null;
    save(); updateConnStatus(); renderAccountList(); showAccountDetails();
  }));
}

async function loadCampaigns(){
  const acc = state.selectedAdAccount;
  if(!acc) return;
  document.getElementById('campSummary').innerHTML = '<span class="loading"></span> Carregando campanhas...';
  try{
    // 1) Campanhas
    const campRes = await fetch(`${FB_API}/${acc}/campaigns?fields=id,name,status,objective,daily_budget,lifetime_budget,buying_type,bid_strategy,start_time,stop_time&limit=200&access_token=${encodeURIComponent(state.token)}`);
    const campData = await campRes.json();
    if(campData.error) throw new Error(campData.error.message);
    const campaigns = campData.data || [];

    // 2) Insights por campanha
    const params = new URLSearchParams({
      level:'campaign',
      fields:'campaign_id,campaign_name,spend,actions,action_values,reach,impressions,ctr,cpc,cpm,frequency,clicks',
      date_preset: state.adsPeriod, limit:'500'
    });
    const insRes = await fetch(`${FB_API}/${acc}/insights?${params}&access_token=${encodeURIComponent(state.token)}`);
    const insData = await insRes.json();
    if(insData.error){ console.warn('Insights erro:', insData.error.message); }
    const insMap = {};
    (insData.data||[]).forEach(i=>{ insMap[i.campaign_id] = i; });

    // 3) Conta info atualizada
    const accInfoRes = await fetch(`${FB_API}/${acc}?fields=balance,amount_spent,spend_cap,currency,name,account_status&access_token=${encodeURIComponent(state.token)}`);
    state.cachedAccountInfo = await accInfoRes.json();

    // 4) Mescla
    state.cachedCampaigns = campaigns.map(c=>({...c, ...computeMetrics(c, insMap[c.id]||{}, state.cachedAccountInfo.currency)}));
    save();
    renderAccountKPIs();
    renderCampaignTable();
  }catch(err){
    document.getElementById('campSummary').innerHTML = `<span style="color:var(--danger)">Erro: ${escapeHtml(err.message)}</span>`;
  }
}

function sumActions(actions, names){
  if(!actions || !names || !names.length) return 0;
  return actions.filter(a=>names.includes(a.action_type)).reduce((s,a)=>s+parseFloat(a.value||0),0);
}

function computeMetrics(camp, ins, currency){
  const spend = parseFloat(ins.spend||0);
  const reach = parseInt(ins.reach||0);
  const impressions = parseInt(ins.impressions||0);
  const clicks = parseInt(ins.clicks||0);
  const ctr = parseFloat(ins.ctr||0);
  const cpc = parseFloat(ins.cpc||0);
  const cpm = parseFloat(ins.cpm||0);
  const freq = parseFloat(ins.frequency||0);

  // Resultado baseado no objetivo da campanha
  const obj = camp.objective || '';
  const cfg = RESULT_BY_OBJECTIVE[obj] || RESULT_BY_OBJECTIVE.OUTCOME_SALES;
  let resultCount = 0, resultLabel = cfg.label;
  if(cfg.actions && cfg.actions.length){
    resultCount = sumActions(ins.actions, cfg.actions);
  } else {
    resultCount = reach; // pra awareness/reach
  }

  // Compras + receita (sempre tenta, mesmo objetivo não-vendas — útil pra ROAS cross-campaign)
  const purchases = sumActions(ins.actions, ['purchase','offsite_conversion.fb_pixel_purchase','onsite_conversion.purchase','omni_purchase']);
  const revenue = sumActions(ins.action_values, ['purchase','offsite_conversion.fb_pixel_purchase','onsite_conversion.purchase','omni_purchase']);

  const roas = spend>0 ? revenue/spend : 0;
  const cpa = purchases>0 ? spend/purchases : 0;
  const cpr = resultCount>0 ? spend/resultCount : 0; // Custo por resultado (varia conforme objetivo)

  const dailyBudget = camp.daily_budget ? parseFloat(camp.daily_budget)/100 : null;
  const lifetimeBudget = camp.lifetime_budget ? parseFloat(camp.lifetime_budget)/100 : null;

  return {
    spend, reach, impressions, clicks, ctr, cpc, cpm, freq,
    resultCount, resultLabel, cpr,
    purchases, revenue, roas, cpa,
    dailyBudget, lifetimeBudget, currency,
    objectiveLabel: OBJECTIVE_LABELS[obj] || obj
  };
}

function renderCampaignTable(){
  const head = document.getElementById('campHead');
  const body = document.getElementById('campBody');
  if(!head || !body) return;

  const cols = [
    {k:'name', l:'Campanha'},
    {k:'objectiveLabel', l:'Tipo'},
    {k:'status', l:'Status'},
    {k:'dailyBudget', l:'Orçamento'},
    {k:'spend', l:'Gasto'},
    {k:'resultCount', l:'Resultado'},
    {k:'cpr', l:'Custo/result.'},
    {k:'ctr', l:'CTR'},
    {k:'cpm', l:'CPM'},
    {k:'roas', l:'ROAS'},
    {k:'revenue', l:'Receita'}
  ];
  head.innerHTML = cols.map(c=>{
    const arrow = state.campSortKey===c.k ? (state.campSortAsc?'↑':'↓') : '';
    return `<th data-sort="${c.k}">${c.l} ${arrow}</th>`;
  }).join('');
  head.querySelectorAll('[data-sort]').forEach(th=> th.addEventListener('click',()=>{
    if(state.campSortKey===th.dataset.sort) state.campSortAsc = !state.campSortAsc;
    else { state.campSortKey = th.dataset.sort; state.campSortAsc = false; }
    save(); renderCampaignTable();
  }));

  const term = (document.getElementById('campSearch')?.value||'').toLowerCase();
  const stFilter = document.getElementById('campStatusFilter')?.value||'all';
  let rows = state.cachedCampaigns.filter(c=>{
    if(stFilter!=='all' && c.status!==stFilter) return false;
    if(term && !c.name.toLowerCase().includes(term)) return false;
    return true;
  });
  rows.sort((a,b)=>{
    const k = state.campSortKey;
    let av = a[k], bv = b[k];
    if(typeof av==='string'){
      return state.campSortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
    }
    av = av||0; bv = bv||0;
    return state.campSortAsc ? av-bv : bv-av;
  });

  const currency = state.cachedAccountInfo?.currency || 'BRL';
  const fmtM = v => fmtMoney(v||0, currency);
  const total = state.cachedCampaigns.length;
  const active = state.cachedCampaigns.filter(c=>c.status==='ACTIVE').length;
  document.getElementById('campSummary').textContent = `${rows.length} de ${total} campanhas · ${active} ativas`;

  if(!rows.length){
    body.innerHTML = `<tr><td colspan="${cols.length}" style="text-align:center;padding:30px;color:var(--text-dim)">Nenhuma campanha com esses filtros.</td></tr>`;
    return;
  }

  body.innerHTML = rows.map(c=>{
    const stCls = c.status==='ACTIVE'?'status-active':c.status==='PAUSED'?'status-paused':c.status==='ARCHIVED'?'status-archived':'status-other';
    const stLabel = c.status==='ACTIVE'?'Ativa':c.status==='PAUSED'?'Pausada':c.status==='ARCHIVED'?'Arquivada':c.status||'—';
    const roasCls = c.roas>=2?'good':c.roas>=1?'warn':c.roas>0?'bad':'null';
    const ctrCls = c.ctr>=2?'good':c.ctr>=1?'warn':c.ctr>0?'bad':'null';
    const budget = c.dailyBudget ? fmtM(c.dailyBudget)+'/dia' : c.lifetimeBudget ? fmtM(c.lifetimeBudget)+' total' : '—';
    return `
      <tr>
        <td title="${escapeHtml(c.name)}" style="max-width:280px"><span class="has-value">${escapeHtml(c.name.length>50?c.name.slice(0,50)+'…':c.name)}</span></td>
        <td><span class="obj-pill">${escapeHtml(c.objectiveLabel)}</span></td>
        <td><span class="status-pill ${stCls}">${stLabel}</span></td>
        <td class="${budget==='—'?'null':'has-value'}">${budget}</td>
        <td class="${c.spend>0?'has-value':'null'}">${c.spend>0?fmtM(c.spend):'—'}</td>
        <td class="${c.resultCount>0?'has-value':'null'}">${c.resultCount>0?fmtNum(Math.round(c.resultCount)):'—'}<br><small style="color:var(--text-muted);font-size:10px">${c.resultLabel}</small></td>
        <td class="${c.cpr>0?'has-value':'null'}">${c.cpr>0?fmtM(c.cpr):'—'}</td>
        <td class="${ctrCls}">${c.ctr>0?c.ctr.toFixed(2)+'%':'—'}</td>
        <td class="${c.cpm>0?'has-value':'null'}">${c.cpm>0?fmtM(c.cpm):'—'}</td>
        <td class="${roasCls}">${c.roas>0?c.roas.toFixed(2)+'x':'—'}</td>
        <td class="${c.revenue>0?'has-value':'null'}">${c.revenue>0?fmtM(c.revenue):'—'}</td>
      </tr>
    `;
  }).join('');
}

function exportAdsCsv(){
  const currency = state.cachedAccountInfo?.currency||'BRL';
  const lines = ['Nome;Tipo;Status;Orçamento;Gasto;Resultado;Tipo do Resultado;Custo por Resultado;CTR;CPM;ROAS;Receita;Compras'];
  state.cachedCampaigns.forEach(c=>{
    const budget = c.dailyBudget ? c.dailyBudget.toFixed(2).replace('.',',')+'/dia' : c.lifetimeBudget ? c.lifetimeBudget.toFixed(2).replace('.',',')+' total' : '';
    lines.push([
      c.name, c.objectiveLabel, c.status, budget,
      c.spend.toFixed(2).replace('.',','),
      Math.round(c.resultCount), c.resultLabel,
      c.cpr.toFixed(2).replace('.',','),
      c.ctr.toFixed(2).replace('.',','),
      c.cpm.toFixed(2).replace('.',','),
      c.roas.toFixed(2).replace('.',','),
      c.revenue.toFixed(2).replace('.',','),
      c.purchases
    ].map(x=>String(x).replace(/;/g,',')).join(';'));
  });
  const blob = new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `meta-ads-${(state.cachedAccountInfo?.name||'conta').replace(/[^a-z0-9]/gi,'-').toLowerCase()}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  toast('CSV exportado');
}

        if(data.section==='body' && data.column.index===7){
          const txt = data.cell.text[0];
          if(txt && txt!=='—'){
            const v = parseFloat(txt);
            if(v>=2) data.cell.styles.textColor=[16,185,129];
            else if(v>=1) data.cell.styles.textColor=[245,158,11];
            else if(v>0) data.cell.styles.textColor=[239,68,68];
          }
        }
      }
    });

    // ===== ANÁLISE IA (se tiver no DOM) =====
    const aiResp = document.getElementById('adsAiResponse');
    const aiText = aiResp && aiResp.style.display!=='none' ? aiResp.innerText.trim() : '';
    if(aiText && aiText.length>50 && !aiText.startsWith('A análise')){
      pdf.addPage(); y = margin;
      pdf.setTextColor(232,236,243); pdf.setFont('helvetica','bold'); pdf.setFontSize(13);
      pdf.text('✦ Análise estratégica', margin, y); y+=8;
      pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(60,60,60);
      const aiLines = pdf.splitTextToSize(aiText, pw-margin*2);
      let yy = y;
      aiLines.forEach(line=>{
        if(yy>ph-20){ pdf.addPage(); yy = margin; }
        pdf.text(line, margin, yy); yy += 5;
      });
    }

    // ===== FOOTER em todas as páginas =====
    const totalPages = pdf.getNumberOfPages();
    for(let p=1; p<=totalPages; p++){
      pdf.setPage(p);
      pdf.setFontSize(7); pdf.setTextColor(140,150,170);
      pdf.text(`Envolve · Relatório Meta Ads — ${acc.name||'conta'} — pág ${p}/${totalPages}`, pw/2, ph-6, {align:'center'});
    }

    const fname = `meta-ads-${(acc.name||'conta').replace(/[^a-z0-9]/gi,'-').toLowerCase()}-${state.adsPeriod}-${new Date().toISOString().slice(0,10)}.pdf`;
    pdf.save(fname);
    toast('PDF gerado: '+fname);
  }catch(err){
    toast('Erro ao gerar PDF: '+err.message,'error');
    console.error(err);
  }
}

function hexToRgb(hex){
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

  {icon:'🚀', title:'O que escalar',    desc:'campanhas com ROAS saudável',     prompt:'Quais campanhas devo escalar agora e por quê? Considere ROAS, CPA, volume e consistência. Diga quanto aumentar de orçamento e em que ritmo.'},
  {icon:'🛑', title:'O que cortar',     desc:'eficiência ruim',                 prompt:'Quais campanhas devo pausar/desligar imediatamente e por quê? Identifique campanhas com ROAS abaixo de 1, CPA muito alto, ou que estão queimando dinheiro sem retorno.'},
  {icon:'🔄', title:'Realocar orçamento', desc:'mover dinheiro pra onde rende', prompt:'Sugira realocação de orçamento entre campanhas: de onde tirar e pra onde colocar. Considere ROAS marginal e capacidade de escala. Quero números concretos.'},
  {icon:'⚠️', title:'Ineficiências',    desc:'CPM, CTR, frequência',            prompt:'Identifique ineficiências escondidas: CPM acima do mercado, CTR muito baixo, frequência alta (audiência saturada), CPCs caros. Sugira diagnóstico e ação pra cada uma.'},
  {icon:'📉', title:'Pior ROAS',        desc:'piores performers',               prompt:'Liste as 5 piores campanhas por ROAS e diagnóstico de cada uma: é problema de oferta? público? criativo? canal? Pra cada uma, dê hipótese e ação concreta.'},
  {icon:'🏆', title:'Top performers',   desc:'pontos fortes a replicar',        prompt:'Identifique meus top performers e EXTRAIA padrões: que tipo de objetivo, formato, público parecem funcionar. Sugira como replicar esses padrões em novas campanhas.'},
  {icon:'💰', title:'Saúde da conta',   desc:'saldo, projeção e risco',         prompt:'Avalie a saúde financeira da conta: saldo na BM, ritmo de queima, projeção de quanto tempo o saldo dura no ritmo atual, risco de pause por saldo zerado. Inclua recomendação de recarga.'},
];

function renderAdsAiButtons(){
  const grid = document.getElementById('adsAiGrid');
  if(!grid) return;
  grid.innerHTML = ADS_PROMPTS.map(p=>`
    <button class="ai-card" data-ads-ai='${escapeHtml(JSON.stringify(p))}'>
      <div class="icon">${p.icon}</div>
      <div class="title">${p.title}</div>
      <div class="desc">${p.desc}</div>
    </button>
  `).join('');
  grid.querySelectorAll('[data-ads-ai]').forEach(b=> b.addEventListener('click',()=>{
    const p = JSON.parse(b.dataset.adsAi);
    runAdsAi(p);
  }));
}

async function runAdsAi(prompt){
  const cfg = (getJSON('envolve.insights.v1')||{}).apiConfig;
  const respEl = document.getElementById('adsAiResponse');
  respEl.style.display='block';
  if(!cfg || !cfg.apiKey){
    respEl.innerHTML = `<div style="color:var(--warning)"><strong>IA não configurada.</strong> Vá em <a href="insights.html" style="color:var(--meta)">Insights & IA</a> pra adicionar sua chave (Claude/OpenAI/Gemini).</div>`;
    return;
  }
  respEl.innerHTML = '<span class="loading"></span> Analisando dados das campanhas...';
  try{
    const acc = state.cachedAccountInfo || {};
    const currency = acc.currency || 'BRL';
    const fmtM = v => fmtMoney(v||0, currency);
    const totalSpend = state.cachedCampaigns.reduce((s,c)=>s+c.spend,0);
    const totalRevenue = state.cachedCampaigns.reduce((s,c)=>s+c.revenue,0);
    const totalPurchases = state.cachedCampaigns.reduce((s,c)=>s+c.purchases,0);
    const totalResults = state.cachedCampaigns.reduce((s,c)=>s+c.resultCount,0);
    const balance = acc.balance!=null?parseFloat(acc.balance)/100:null;
    const amountSpent = acc.amount_spent!=null?parseFloat(acc.amount_spent)/100:null;

    let ctx = `=== CONTEXTO META ADS ===\n`;
    ctx += `Conta: ${acc.name||'—'}\n`;
    ctx += `Moeda: ${currency}\n`;
    ctx += `Período: ${state.adsPeriod}\n`;
    ctx += `Saldo na BM: ${balance==null?'(pós-pago, não disponível)':fmtM(balance)}\n`;
    ctx += `Gasto histórico total: ${amountSpent?fmtM(amountSpent):'—'}\n\n`;
    ctx += `RESUMO PERÍODO:\n`;
    ctx += `Gasto: ${fmtM(totalSpend)}\n`;
    ctx += `Receita: ${fmtM(totalRevenue)}\n`;
    ctx += `Compras: ${totalPurchases}\n`;
    ctx += `Resultados totais: ${Math.round(totalResults)}\n`;
    ctx += `ROAS médio: ${totalSpend>0?(totalRevenue/totalSpend).toFixed(2)+'x':'—'}\n`;
    ctx += `CPA médio (compras): ${totalPurchases>0?fmtM(totalSpend/totalPurchases):'—'}\n\n`;
    ctx += `CAMPANHAS (${state.cachedCampaigns.length}):\n`;
    [...state.cachedCampaigns].sort((a,b)=>b.spend-a.spend).forEach(c=>{
      ctx += `- "${c.name}" | ${c.objectiveLabel} | ${c.status} | gasto ${fmtM(c.spend)} | ${c.resultLabel}: ${Math.round(c.resultCount)} | custo/result ${c.cpr>0?fmtM(c.cpr):'—'} | CTR ${c.ctr.toFixed(2)}% | CPM ${fmtM(c.cpm)} | ROAS ${c.roas.toFixed(2)}x | receita ${fmtM(c.revenue)}${c.dailyBudget?` | orçam ${fmtM(c.dailyBudget)}/dia`:''}\n`;
    });

    const SYSTEM = `Você é um Estrategista Sênior de Growth Marketing especializado em Meta Ads (Diretor de Performance). Sua função é analisar dados reais e dar recomendações pragmáticas. Princípios:
- Seja DIRETO e CONCRETO, com números reais do contexto.
- Pense em ROAS, CPA, escala marginal e eficiência.
- Considere o objetivo de cada campanha — leads e vendas têm benchmarks diferentes.
- Ao recomendar ação, diga QUAL campanha, QUANTO mexer, e POR QUE.
- Use markdown leve (negrito, listas).
- Português do Brasil, tom executivo.`;
    const userPrompt = `${ctx}\n\n=== ANÁLISE PEDIDA ===\n${prompt.prompt}`;

    let response;
    if(cfg.provider==='claude'){
      const r = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':cfg.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:cfg.model,max_tokens:2048,system:SYSTEM,messages:[{role:'user',content:userPrompt}]})});
      if(!r.ok) throw new Error((await r.text()).slice(0,300));
      response = (await r.json()).content?.[0]?.text || '';
    } else if(cfg.provider==='openai'){
      const r = await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+cfg.apiKey},body:JSON.stringify({model:cfg.model,messages:[{role:'system',content:SYSTEM},{role:'user',content:userPrompt}],max_tokens:2048})});
      if(!r.ok) throw new Error((await r.text()).slice(0,300));
      response = (await r.json()).choices?.[0]?.message?.content || '';
    } else if(cfg.provider==='gemini'){
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${cfg.model}:generateContent?key=${cfg.apiKey}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:SYSTEM}]},contents:[{role:'user',parts:[{text:userPrompt}]}],generationConfig:{maxOutputTokens:2048}})});
      if(!r.ok) throw new Error((await r.text()).slice(0,300));
      response = (await r.json()).candidates?.[0]?.content?.parts?.[0]?.text || '';
    }
    let html = escapeHtml(response);
    html = html.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>');
    html = html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    html = html.replace(/`([^`]+)`/g,'<code>$1</code>');
    respEl.innerHTML = `<div style="font-size:11px;color:var(--text-dim);margin-bottom:10px">✦ ${prompt.title} · ${cfg.provider}/${cfg.model}</div>${html}`;
  }catch(err){
    respEl.innerHTML = `<div style="color:var(--danger)"><strong>Erro:</strong> ${escapeHtml(err.message)}</div>`;
  }
}
