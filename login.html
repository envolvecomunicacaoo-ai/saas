<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Envolve · Login</title>
<style>
  :root{
    --bg:#0a0e1a; --surface:#111827; --surface-2:#1a2233; --border:#252f44;
    --text:#e8ecf3; --text-dim:#8b95a8; --text-muted:#5c6680;
    --accent:#7c5cff; --accent-2:#5b8cff;
    --success:#10b981; --danger:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
    background-image:
      radial-gradient(circle at 10% 0%,rgba(124,92,255,.15),transparent 50%),
      radial-gradient(circle at 90% 100%,rgba(228,64,95,.10),transparent 50%);
    background-attachment:fixed;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    width:100%; max-width:380px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:36px 32px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .logo{
    font-size:20px; font-weight:700; letter-spacing:-.02em;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:6px;
  }
  .subtitle{ color:var(--text-dim); font-size:13px; margin-bottom:28px; }
  label{
    display:block; font-size:12px; font-weight:600;
    color:var(--text-dim); margin-bottom:8px;
    text-transform:uppercase; letter-spacing:.05em;
  }
  input[type=password]{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:12px 14px;
    border-radius:10px;
    font-size:14px;
    font-family:inherit;
    transition:border-color .15s, background .15s;
  }
  input[type=password]:focus{
    outline:none;
    border-color:var(--accent);
    background:#1f2740;
  }
  button{
    width:100%; margin-top:20px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff; border:none;
    padding:13px;
    border-radius:10px;
    font-size:14px; font-weight:600;
    font-family:inherit;
    cursor:pointer;
    transition:opacity .15s, transform .1s;
  }
  button:hover{ opacity:.92; }
  button:active{ transform:scale(.98); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .error{
    margin-top:14px;
    padding:10px 12px;
    background:rgba(239,68,68,.1);
    border:1px solid rgba(239,68,68,.3);
    border-radius:8px;
    color:var(--danger);
    font-size:12.5px;
    display:none;
  }
  .error.show{ display:block; }
  .hint{
    margin-top:24px; padding-top:18px;
    border-top:1px solid var(--border);
    color:var(--text-muted); font-size:11.5px; line-height:1.6;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Envolve</div>
  <div class="subtitle">Sistema operacional da equipe</div>

  <form id="loginForm">
    <label for="password">Senha da equipe</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
    <button type="submit" id="submitBtn">Entrar</button>
    <div class="error" id="error"></div>
  </form>

  <div class="hint">
    Se você não tem a senha, peça pro Jackson.<br>
    Esta tela só aparece uma vez por dispositivo.
  </div>
</div>

<script>
(function(){
  'use strict';

  // Se já tem token, vai direto pro app
  if (localStorage.getItem('envolve.auth.token')) {
    location.replace('index.html');
    return;
  }

  const form = document.getElementById('loginForm');
  const input = document.getElementById('password');
  const btn = document.getElementById('submitBtn');
  const errorEl = document.getElementById('error');

  function showError(msg){
    errorEl.textContent = msg;
    errorEl.classList.add('show');
  }
  function clearError(){
    errorEl.classList.remove('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();
    btn.disabled = true;
    btn.textContent = 'Verificando...';

    try {
      const res = await fetch('/.netlify/functions/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: input.value })
      });

      if (res.status === 503) {
        showError('Sistema ainda não configurado. Setar TEAM_PASSWORD no Netlify.');
      } else if (res.status === 401) {
        showError('Senha incorreta.');
        input.select();
      } else if (!res.ok) {
        showError('Erro ' + res.status + '. Tenta de novo.');
      } else {
        const data = await res.json();
        localStorage.setItem('envolve.auth.token', data.token);
        location.replace('index.html');
        return;
      }
    } catch (err) {
      showError('Erro de conexão: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });
})();
</script>
</body>
</html>
